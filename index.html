<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactHub-Smart Contact Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!---------------------------------------navbar------------------------------------------------->
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container">
            <div class="d-flex align-items-center gap-3">
                <div class="logo-icon">
                    <i class="fa-solid fa-address-book"></i>
                </div>

                <div>
                    <div class="fw-bold logo-text">
                        Contact<span class="hub">Hub</span>
                    </div>
                    <div class="small text-secondary">
                        Smart Contact Manager
                    </div>
                </div>
            </div>


            <div class="ms-auto d-flex align-items-center gap-3">
                <button class="btn add-contact" type="button" data-bs-toggle="modal" data-bs-target="#addContactModal">
                    <i class="fa-solid fa-plus me-2"></i>
                    Add Contact
                </button>

                <button class="btn btn-icon">
                    <i class="fa-solid fa-bell"></i>
                </button>

                <button class="btn btn-icon">
                    <i class="fa-solid fa-gear"></i>
                </button>

                <img src="images/avatar-4.jpg" alt="avatar4" class="profile-img">

            </div>
        </div>
    </nav>
    <!------------------------------------------main body----------------------------------------------------------------------->

    <main class="main-content">

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon total-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <p class="stat-label">TOTAL</p>
                    <h3 id="totalCount">0</h3>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon favorites-icon">
                    <i class="fa-solid fa-star"></i>
                </div>
                <div>
                    <p class="stat-label">FAVORITES</p>
                    <h3 id="favoriteCount">0</h3>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon emergency-icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <div>
                    <p class="stat-label">EMERGENCY</p>
                    <h3 id="emergencyCount">0</h3>
                </div>
            </div>
        </section>

        <section class="contacts-layout">

            <div class="all-contacts">

                <div class="contacts-heading">
                    <div>
                        <h2>All Contacts</h2>
                        <p class="section-description">
                            Manage and organize your contacts
                        </p>
                    </div>


                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="searchInput" class="form-control"
                        placeholder="Search by name, phone, or email..." oninput="searchContacts(this.value)">
                </div>

                <div class="contacts-grid" id="contactsContainer">
                </div>
            </div>

            <div class="contacts-sidebar">

                <div class="sidebar-card">
                    <div class="sidebar-header">
                        <div class="sidebar-icon favorites-icon">
                            <i class="fa-solid fa-star"></i>
                        </div>

                        <div>
                            <h5>Favorites</h5>
                            <p>Quick access to starred contacts</p>
                        </div>
                    </div>

                    <div class="sidebar-body" id="favoritesContainer">
                        <p>No favorites yet</p>
                    </div>
                </div>

                <div class="sidebar-card">
                    <div class="sidebar-header">
                        <div class="sidebar-icon emergency-icon">
                            <i class="fa-solid fa-heart-pulse"></i>
                        </div>

                        <div>
                            <h5>Emergency</h5>
                            <p>Important contacts for urgent calls</p>
                        </div>
                    </div>

                    <div class="sidebar-body" id="emergencyContainer">
                        <p>No emergency contacts</p>
                    </div>
                </div>

            </div>
        </section>
    </main>


    <!---------------------------------------modal --------------------------------------------------------------->

    <div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="addContactModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content contact-modal">
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title fw-bold" id="addContactModalLabel">
                            Add New Contact
                        </h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>

                <form id="contactForm">
                    <div class="modal-body">

                        <div class="contact-photo-section">
                            <div class="contact-photo-preview">
                                <i class="fa-solid fa-user"></i>
                            </div>

                            <label for="photoInput" class="btn btn-secondary btn-sm" id="changePhotoBtn">
                                <i class="fa-solid fa-camera"></i>
                                Change Photo
                            </label>

                            <input type="file" id="photoInput" accept="image/*" hidden>
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">
                                Full Name <span class="required">*</span>
                            </label>

                            <input type="text" class="form-control" id="fullName" placeholder="Enter full name"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">
                                Phone Number <span class="required">*</span>
                            </label>

                            <input type="tel" class="form-control" id="phoneNumber" placeholder="e.g. 01012345678"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="emailAddress" class="form-label">
                                Email Address
                            </label>

                            <input type="email" class="form-control" id="emailAddress"
                                placeholder="e.g. name@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">
                                Address
                            </label>

                            <input type="text" class="form-control" id="address" placeholder="Enter address">
                        </div>

                        <div class="mb-3">
                            <label for="group" class="form-label">
                                Group
                            </label>

                            <select class="form-select" id="group">
                                <option value="">Select a group</option>
                                <option value="family">Family</option>
                                <option value="friends">Friends</option>
                                <option value="work">Work</option>
                                <option value="school">School</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label">
                                Notes
                            </label>

                            <textarea class="form-control" id="notes" rows="3"
                                placeholder="Add notes about this contact"></textarea>
                        </div>
                        <div class="contact-options">
                            <label class="form-check">
                                <input class="form-check-input" type="checkbox" id="isFavorite">
                                <span class="form-check-label">
                                    <i class="fa-solid fa-star favorite-color me-1"></i>
                                    Add to Favorites
                                </span>
                            </label>

                            <label class="form-check">
                                <input class="form-check-input" type="checkbox" id="isEmergency">

                                <span class="form-check-label">
                                    <i class="fa-solid fa-heart-pulse emergency-color me-1"></i>
                                    Emergency Contact
                                </span>
                            </label>

                        </div>
                    </div>

                    <!-------------------------------buttons---------------------------------------------->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button onclick="saveContact()" type="button" class="btn btn-primary" id="saveContactBtn">
                            <i class="fas fa-check"></i> Save Contact
                        </button>

                        <button onclick="updateContact()" type="button" class="btn btn-warning d-none"
                            id="updateContactBtn">
                            <i class="fas fa-check"></i> update Contact
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/index.js"></script>

</body>

</html>
